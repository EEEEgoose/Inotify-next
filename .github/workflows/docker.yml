name: docker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: write # push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Check out the repository code
    - name: Check out the repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    # 2. Set up Docker Buildx for advanced features like caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    # 3. Login to Docker Hub (not for pull requests: they only check that the image builds)
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Login to GitHub Container Registry (GHCR)
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 5. Generate metadata for Docker (tags and labels) for both registries
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/inotify-next
          ghcr.io/${{ github.repository }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    # 6. Build (web UI and server, see ./Dockerfile) and push the image to both registries
    - name: Build and Push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Enable build cache using GitHub Actions cache
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 7. Report build status
    - name: 'Report Success'
      if: github.event_name != 'pull_request'
      # Optional: skipped when the INOTIFY secret is not set
      env:
        INOTIFY: ${{ secrets.INOTIFY }}
      run: if [ -n "$INOTIFY" ]; then curl "$INOTIFY/Inotify/latestIsOK!"; fi
