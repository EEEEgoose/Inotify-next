name: docker_dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Check out the repository code
    - name: Check out the repo
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx for advanced features like caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Login to Docker Hub (not for pull requests: they only check that the image builds)
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Login to GitHub Container Registry (GHCR)
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 5. Generate metadata for Docker (tags and labels) for both registries
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/inotify-next
          ghcr.io/${{ github.repository }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    # 6. Build (web UI and server, see ./Dockerfile) and push the image to both registries
    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Enable build cache using GitHub Actions cache
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 7. Report build status
    - name: 'Report Success'
      if: github.event_name != 'pull_request'
      # Optional: skipped when the INOTIFY secret is not set
      env:
        INOTIFY: ${{ secrets.INOTIFY }}
      run: if [ -n "$INOTIFY" ]; then curl "$INOTIFY/Inotify/latestIsOK!"; fi
